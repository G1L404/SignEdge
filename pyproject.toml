[project]
name = "signedge"
version = "0.1.0"
description = "Destilação, poda e quantização Int8 para reconhecimento de sinais no dispositivo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# O modelo do MediaPipe Hands fica em data/models/hand_landmarker.task, fora do Git.
ingest = [
    "mediapipe>=0.10.30",
    "opencv-python>=4.8",
    "openni>=2.3",
]
train = [
    "lmdb>=1.4",
    "tensorboard>=2.16",
    "timm>=1.0.9",
    # Com CUDA: pip install --index-url https://download.pytorch.org/whl/cu130 torch torchvision
    "torch>=2.4",
    "torchvision>=0.19",
]
quantize = [
    "tensorflow>=2.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
signedge-ingest = "research.ingestion.build_dataset:main"
signedge-train = "research.train:main"
signedge-prune = "research.optimization.pruner:main"
signedge-quantize = "research.optimization.quantizer:main"
signedge-eval-tflite = "research.optimization.eval_tflite:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["research", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
